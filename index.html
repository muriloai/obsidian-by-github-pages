<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#22283a" />
    <meta name="description" content="Editor Markdown com arquivos .md no Google Drive (vault Obsidian)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brain Drive" />
    <link rel="manifest" href="./manifest.json?v=21" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Brain Drive</title>
    <!-- EasyMDE usa ícones Font Awesome 4 nos botões da barra; sem isto só aparecem os separadores | -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.css"
    />
    <link rel="stylesheet" href="./styles.css?v=21" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">Brain Drive</div>
      <div class="header-actions">
        <div class="header-meta-wrap">
          <div class="header-meta" aria-live="polite">
            <span
              id="list-loading-spinner"
              class="loading-spinner loading-spinner--inline"
              hidden
              aria-hidden="true"
            ></span>
            <span id="save-status" class="save-status"></span>
          </div>
          <div id="status-ttl-bar" class="status-ttl-bar" hidden aria-hidden="true">
            <span id="status-ttl-fill" class="status-ttl-bar__fill"></span>
          </div>
        </div>
        <p id="header-graph-status" class="header-graph-status" aria-live="polite"></p>
        <button
          type="button"
          id="btn-reload-file"
          class="btn btn-ghost btn-with-icon"
          disabled
          title="Recarregar do Google Drive — substitui o texto pela última versão no Drive (alterações não salvas neste editor serão perdidas)"
        >
          <span class="fa fa-refresh" aria-hidden="true"></span>
          <span>Recarregar</span>
        </button>
        <button type="button" id="btn-save" class="btn btn-primary" disabled>Salvar</button>
        <button type="button" id="btn-theme" class="btn btn-ghost" title="Alternar tema claro/escuro">Tema</button>
        <button type="button" id="btn-logout" class="btn btn-ghost" hidden>Sair</button>
        <button type="button" id="btn-reauth-drive" class="btn btn-ghost" hidden>
          Autorizar Google Drive
        </button>
        <button type="button" id="btn-google-login" class="btn btn-google" disabled>Entrar com Google</button>
      </div>
    </header>
    <nav class="vault-tabs" aria-label="Vista do vault">
      <button type="button" id="tab-editor" class="vault-tab is-active">
        <span class="fa fa-edit" aria-hidden="true"></span> Editor
      </button>
      <button type="button" id="tab-graph" class="vault-tab">
        <span class="fa fa-share-alt" aria-hidden="true"></span> Mapa
      </button>
    </nav>
    <main class="app-main">
      <div id="panel-editor" class="panel-editor">
      <aside id="sidebar" class="sidebar" aria-label="Pastas e arquivos Markdown">
        <div id="sidebar-section-title" class="sidebar-head">Notas (.md)</div>
        <div class="sidebar-search-wrap">
          <label class="visually-hidden" for="tree-search">Buscar notas por nome ou caminho</label>
          <span class="sidebar-search-icon fa fa-search" aria-hidden="true"></span>
          <input
            type="search"
            id="tree-search"
            class="sidebar-search"
            placeholder="Buscar por nome ou pasta…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div id="file-tree" class="file-tree" role="tree"></div>
        <p id="file-list-empty" class="file-list-empty">Faça login para ver os arquivos.</p>
      </aside>
      <section class="editor-wrap" aria-label="Editor Markdown">
        <div class="editor-shell">
          <header class="editor-titlebar">
            <h2 id="editor-file-title" class="editor-file-title">
              Editor | selecione um arquivo na lista ao lado
            </h2>
            <button
              type="button"
              id="btn-close-note"
              class="btn btn-icon-close"
              hidden
              title="Fechar nota"
              aria-label="Fechar nota"
            >
              <span class="fa fa-times" aria-hidden="true"></span>
            </button>
          </header>
          <textarea id="markdown-editor" rows="12" aria-label="Conteúdo em Markdown"></textarea>
        </div>
      </section>
      </div>
      <div id="panel-graph" class="panel-graph" hidden>
        <div class="graph-toolbar">
          <p class="graph-hint">
            Clique em uma nota para abrir no Editor. Os filtros do <code>graph.json</code> do Obsidian são aplicados quando existirem.
          </p>
          <details id="graph-config-details" class="graph-config-details" hidden>
            <summary>Arquivos Obsidian (.obsidian)</summary>
            <div id="graph-config-body" class="graph-config-body"></div>
          </details>
        </div>
        <div id="graph-network" class="graph-network" aria-label="Mapa de ligações entre notas"></div>
      </div>
    </main>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Núcleo CM antes do addon: show-hint.js usa CodeMirror global na linha 1 -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.js"></script>
    <!-- v=invalida cache agressivo do GitHub Pages / browser -->
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <script src="./app.js?v=21" defer></script>
  </body>
</html>
